{% extends "base.html" %} 
{% block title %}Login{% endblock %} 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card mt-4 login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="fas fa-user-circle fa-4x text-primary mb-3"></i>
          <h2 class="card-title font-weight-bold">Admin Login</h2>
          <p class="text-muted">Sign in to access your dashboard</p>
        </div>

        <div class="mb-4">
          <a href="http://localhost:4200/" class="btn btn-outline-secondary btn-block d-flex align-items-center justify-content-center">
            <i class="fas fa-arrow-left mr-2"></i> Return to Site
          </a>
        </div>

        <form method="POST">
          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope mr-2 text-primary"></i>Email Address
            </label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-light">
                  <i class="fas fa-at"></i>
                </span>
              </div>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock mr-2 text-primary"></i>Password
            </label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-light">
                  <i class="fas fa-key"></i>
                </span>
              </div>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>
          
          <div class="form-group">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input" id="remember-me">
              <label class="custom-control-label" for="remember-me">Remember me</label>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fas fa-sign-in-alt mr-2"></i>Login
          </button>
        </form>
        
        <div class="text-center mt-4">
          <p class="mb-0">Don't have an account? <a href="/sign-up" class="text-primary font-weight-bold">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .login-card {
    border: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    border-radius: 12px;
  }
  
  .login-card .form-control {
    height: 50px;
    padding-left: 15px;
    font-size: 16px;
    border-color: #e1e5eb;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }
  
  .login-card .input-group-text {
    border-color: #e1e5eb;
    background-color: #f8f9fa;
    border-right: none;
    padding: 0 15px;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  
  .login-card .btn-primary {
    height: 50px;
    margin-top: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
    transition: all 0.3s;
  }
  
  .login-card .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(33, 150, 243, 0.4);
  }
  
  .login-card .btn-outline-secondary {
    height: 45px;
    border-color: #ddd;
    color: #666;
    font-weight: 500;
    transition: all 0.3s;
  }
  
  .login-card .btn-outline-secondary:hover {
    background-color: #f1f1f1;
    color: #333;
  }
  
  .login-card label {
    font-weight: 500;
    color: #555;
    margin-bottom: 8px;
  }
  
  .login-card .text-primary {
    color: #2196f3 !important;
  }
  
  .login-card .custom-control-input:checked ~ .custom-control-label::before {
    background-color: #2196f3;
    border-color: #2196f3;
  }
  
  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .login-card {
    animation: fadeIn 0.5s ease-out forwards;
  }
</style>
{% endblock %}
