{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card mt-4 signup-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="fas fa-user-plus fa-4x text-primary mb-3"></i>
          <h2 class="card-title font-weight-bold">Create Admin Account</h2>
          <p class="text-muted">Register to gain access to the admin dashboard</p>
        </div>

        <div class="mb-4">
          <a href="http://localhost:4200/" class="btn btn-outline-secondary btn-block d-flex align-items-center justify-content-center">
            <i class="fas fa-arrow-left mr-2"></i> Return to Site
          </a>
        </div>

        <form method="POST">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="email">
                  <i class="fas fa-envelope mr-2 text-primary"></i>Email Address
                </label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text bg-light">
                      <i class="fas fa-at"></i>
                    </span>
                  </div>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                  />
                </div>
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="form-group">
                <label for="firstName">
                  <i class="fas fa-user mr-2 text-primary"></i>First Name
                </label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text bg-light">
                      <i class="fas fa-id-card"></i>
                    </span>
                  </div>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter your name"
                    required
                  />
                </div>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="password1">
                  <i class="fas fa-lock mr-2 text-primary"></i>Password
                </label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text bg-light">
                      <i class="fas fa-key"></i>
                    </span>
                  </div>
                  <input
                    type="password"
                    class="form-control"
                    id="password1"
                    name="password1"
                    placeholder="Create password"
                    required
                  />
                </div>
                <small class="form-text text-muted">
                  Use 8+ characters with a mix of letters, numbers & symbols
                </small>
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="form-group">
                <label for="password2">
                  <i class="fas fa-shield-alt mr-2 text-primary"></i>Confirm Password
                </label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text bg-light">
                      <i class="fas fa-check-double"></i>
                    </span>
                  </div>
                  <input
                    type="password"
                    class="form-control"
                    id="password2"
                    name="password2"
                    placeholder="Confirm password"
                    required
                  />
                </div>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="role">
              <i class="fas fa-user-tag mr-2 text-primary"></i>Admin Role
            </label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-light">
                  <i class="fas fa-users-cog"></i>
                </span>
              </div>
              <select class="form-control custom-select" id="role" name="role" required>
                <option value="" selected disabled>Select your admin role</option>
                <option value="admin1">Flights Manager</option>
                <option value="admin2">Product Manager</option>
                <option value="admin3">Hotels Manager</option>
              </select>
            </div>
          </div>
          
          <div class="form-group mt-4">
            <div class="custom-control custom-checkbox">
              <input type="checkbox" class="custom-control-input" id="terms" required>
              <label class="custom-control-label" for="terms">
                I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>
              </label>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-4">
            <i class="fas fa-user-plus mr-2"></i>Create Account
          </button>
        </form>
        
        <div class="text-center mt-4">
          <p class="mb-0">Already have an account? <a href="/login" class="text-primary font-weight-bold">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .signup-card {
    border: none;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    border-radius: 12px;
    margin-bottom: 3rem;
  }
  
  .signup-card .form-control {
    height: 50px;
    padding-left: 15px;
    font-size: 16px;
    border-color: #e1e5eb;
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }
  
  .signup-card .input-group-text {
    border-color: #e1e5eb;
    background-color: #f8f9fa;
    border-right: none;
    padding: 0 15px;
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }
  
  .signup-card .btn-primary {
    height: 50px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
    transition: all 0.3s;
  }
  
  .signup-card .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(33, 150, 243, 0.4);
  }
  
  .signup-card .btn-outline-secondary {
    height: 45px;
    border-color: #ddd;
    color: #666;
    font-weight: 500;
    transition: all 0.3s;
  }
  
  .signup-card .btn-outline-secondary:hover {
    background-color: #f1f1f1;
    color: #333;
  }
  
  .signup-card label {
    font-weight: 500;
    color: #555;
    margin-bottom: 8px;
  }
  
  .signup-card .text-primary {
    color: #2196f3 !important;
  }
  
  .signup-card .custom-control-input:checked ~ .custom-control-label::before {
    background-color: #2196f3;
    border-color: #2196f3;
  }
  
  .signup-card select.form-control {
    padding-right: 30px;
    background-position: right 10px center;
  }
  
  /* Role icons */
  .role-icon {
    display: inline-block;
    width: 16px;
    margin-right: 6px;
    text-align: center;
  }
  
  /* Animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .signup-card {
    animation: fadeIn 0.5s ease-out forwards;
  }
  
  /* Responsive adjustments */
  @media (max-width: 767.98px) {
    .form-group {
      margin-bottom: 1.5rem;
    }
  }
</style>
{% endblock %}
